name: activity-scout
version: 0.1.0
description: A scoped activity-research and planning specialist for Worldo.
hermes_requires: ">=0.20.0"
author: conwabueze

# Hermes replaces only these source-owned files on update. Runtime secrets,
# OAuth state, sessions, memories, and local configuration stay private.
distribution_owned:
  - SOUL.md
  - skills/research/activity-research/
  - skills/research/activity-planning/

# Private deployments may add Discord credentials and Notion OAuth locally.
# Those runtime details deliberately do not belong in this public manifest.
